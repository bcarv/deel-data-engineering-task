services:
  transactions-db:
    build:
      context: ./docker/postgres-db
    environment:
      - POSTGRES_USER=finance_db_user
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=finance_db
    volumes:
        - pg-data:/var/lib/postgresql/data
        - "${PWD}/db-scripts/initialize_db_ddl.sql:/docker-entrypoint-initdb.d/initialize_db_ddl.sql"
        #adding the analytics schema and the tables
        - "${PWD}/db/01-schema/analytics.sql:/docker-entrypoint-initdb.d/z01_analytics_schema.sql"
        - "${PWD}/db/02-tables/dim_customers.sql:/docker-entrypoint-initdb.d/z02_dim_customers.sql"
        - "${PWD}/db/02-tables/dim_products.sql:/docker-entrypoint-initdb.d/z03_dim_products.sql"
        - "${PWD}/db/02-tables/fact_orders.sql:/docker-entrypoint-initdb.d/z04_fact_orders.sql"
        - "${PWD}/db/02-tables/fact_order_items.sql:/docker-entrypoint-initdb.d/z05_fact_order_items.sql"
        - "${PWD}/db/02-tables/orders_status_history.sql:/docker-entrypoint-initdb.d/z06_orders_status_history.sql"
        #adding the views for metric extraction
        - "${PWD}/db/03-views/vw_open_orders_by_delivery_date_status.sql:/docker-entrypoint-initdb.d/z07_vw_open_orders_by_delivery_date_status.sql"
        - "${PWD}/db/03-views/vw_top3_delivery_dates_open_orders.sql:/docker-entrypoint-initdb.d/z08_vw_top3_delivery_dates_open_orders.sql"
        - "${PWD}/db/03-views/vw_pending_items_by_product.sql:/docker-entrypoint-initdb.d/z09_vw_pending_items_by_product.sql"
        - "${PWD}/db/03-views/vw_top3_customers_pending_orders.sql:/docker-entrypoint-initdb.d/z10_vw_top3_customers_pending_orders.sql"
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "wal_level=logical", "-c", "hot_standby=on"]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"

  kafka-connect:
    image: debezium/connect:2.4
    depends_on:
      - kafka
      - transactions-db
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: debezium_connect_configs
      OFFSET_STORAGE_TOPIC: debezium_connect_offsets
      STATUS_STORAGE_TOPIC: debezium_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    ports:
      - "8083:8083"

  debezium-init:
    image: curlimages/curl:latest
    depends_on:
      - kafka-connect
    volumes:
      - "${PWD}/debezium/init-connectors.sh:/init-connectors.sh"
      - "${PWD}/debezium/connectors:/connectors"
    entrypoint: ["/bin/sh", "/init-connectors.sh"]
    restart: "no"

  spark-app:
    build:
      context: ./docker/spark-app
    depends_on:
      - kafka
      - transactions-db
      - debezium-init
    environment:
      - SPARK_LOCAL_IP=spark-app
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - POSTGRES_URL=jdbc:postgresql://transactions-db:5432/finance_db
      - POSTGRES_HOST=transactions-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=finance_db
      - POSTGRES_USER=finance_db_user
      - POSTGRES_PASSWORD=1234
      - CHECKPOINT_DIR=/checkpoints
    volumes:
      - spark-checkpoints:/checkpoints
    ports:
      - "4040:4040"
    restart: unless-stopped

volumes:
  pg-data:
  spark-checkpoints:
